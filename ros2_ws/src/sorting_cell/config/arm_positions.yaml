# =====================================================================================
# Named arm positions used by sorting_controller
# =====================================================================================
# These are REAL VALUES MEASURED ON HARDWARE (jogged on the real arm,
# 2026-10-15; PICK_DOWN_POSITION and RFID_SCAN_POSITION re-measured
# 2026-10-20), EXCEPT LIFT_POSITION, which is derived from
# PICK_DOWN_POSITION, and the FLOATING_POSITION / BIN_B_POSITION joints that
# were aligned rather than measured (see below). They are
# specific to THIS cell's physical layout (pickup area, fixed PN532 reader
# position, bin layout). Re-verify on the arm before reusing this file for a
# different physical setup.
#
# Physical cell layout (see project notes):
#   - Pickup area: directly in front of the arm.
#   - PN532 RFID reader: fixed to the LEFT of the arm. The arm carries a
#     gripped object over this fixed reader (RFID_SCAN_POSITION) to identify
#     it -- the reader itself never moves.
#   - Bins A/B: fixed to the RIGHT of the arm.
#
# Each position lists an angle (degrees) for BASE, SHOULDER, ELBOW, WRIST, and
# WRIST_PITCH, matching the existing /arm/command joint commands. Gripper
# OPEN/CLOSE is issued separately by sorting_controller at pick/place time and
# is not part of a position.
# =====================================================================================

positions:
  # Start/end pose of every cycle (NOT an all-zeros neutral -- that all-zeros
  # baseline is only arm_controller.ino's own firmware-level HOME command, a
  # separate lower-level safety baseline that this ROS-level HOME_POSITION
  # does not touch or replace). The cycle opens the gripper here, then
  # descends to PICK_DOWN_POSITION. It is also where sorting_controller.py
  # sends the arm on cycle end and on fault-recovery.
  HOME_POSITION:
    base: 0
    shoulder: 105
    elbow: 95
    wrist: 100
    wrist_pitch: 90

  # Grip point at the pickup area. After the gripper closes here, the arm
  # lifts to LIFT_POSITION and then moves to RFID_SCAN_POSITION (no return
  # to HOME_POSITION).
  # Re-measured on the real arm 2026-10-20. elbow=175 sits exactly on the
  # ELBOW upper limit (175).
  PICK_DOWN_POSITION:
    base: 0
    shoulder: 85
    elbow: 175
    wrist: 35
    wrist_pitch: 95

  # !!! DERIVED, NOT MEASURED -- must be checked on the real arm !!!
  # Lifts the gripped object clear of the pickup area right after GRIPPER
  # CLOSE, before the move to RFID_SCAN_POSITION. Values are
  # PICK_DOWN_POSITION's with only the elbow raised from 175 to 125.
  LIFT_POSITION:
    base: 0
    shoulder: 85
    elbow: 125
    wrist: 35
    wrist_pitch: 95

  # Holds the gripped object over the fixed PN532 reader.
  # Re-measured on the real arm 2026-10-20 (wrist_pitch unchanged from the
  # 2026-10-16 pose). elbow=175 sits exactly on the ELBOW upper limit (175)
  # and wrist=0 sits exactly on the WRIST lower limit (0).
  RFID_SCAN_POSITION:
    base: 55
    shoulder: 90
    elbow: 175
    wrist: 0
    wrist_pitch: 100

  # Intermediate lifted pose between RFID_SCAN_POSITION and the selected bin.
  # Its base equals RFID_SCAN_POSITION's base, so leaving the scan pose is a
  # straight lift with no base rotation, and its other joints equal the bin
  # poses', so the move from here to either bin only changes the base.
  # Keep it in sync if either RFID_SCAN_POSITION's base or the bin poses change.
  FLOATING_POSITION:
    base: 55
    shoulder: 110
    elbow: 155
    wrist: 15
    wrist_pitch: 100

  # Measured on the real arm 2026-10-15.
  BIN_A_POSITION:
    base: 85
    shoulder: 110
    elbow: 155
    wrist: 15
    wrist_pitch: 100

  # base measured on the real arm 2026-10-15. shoulder and wrist were
  # aligned to BIN_A_POSITION (were 100 and 25) so the move from
  # FLOATING_POSITION only changes the base -- still need checking on the
  # real arm.
  BIN_B_POSITION:
    base: 110
    shoulder: 110
    elbow: 155
    wrist: 15
    wrist_pitch: 100
